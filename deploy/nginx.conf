# /etc/nginx/sites-available/vtb-proto
# Замените server_name на ваш домен или IP.
server {
    listen 80;
    server_name example.com;

    root /var/www/vtb-proto;
    index index.html;

    # Одностраничное приложение: всё отдаём через index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Файлы сборки с хешем в имени можно кешировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
